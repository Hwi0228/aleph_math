<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7f8">
  <title>문제 등록 | ProbOCR</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <style>
    :root {
      font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #292d32;
      background: #f6f7f8;
      --line: #eceef0;
      --blue: #3183f6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; }
    button, input, select, textarea { font: inherit; }
    a { color: inherit; }
    .app { display: grid; grid-template-columns: 172px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { display: flex; flex-direction: column; min-height: 100vh; padding: 0 10px 12px; background: #fff; border-right: 1px solid var(--line); }
    .brand { display: flex; height: 49px; align-items: center; gap: 6px; padding: 0 2px; font-size: 15px; font-weight: 800; white-space: nowrap; }
    .brand-mark { display: grid; width: 16px; height: 16px; place-items: center; border: 4px solid #17191c; border-right-color: #f3a33b; border-radius: 50%; }
    .brand-mark::after { width: 4px; height: 4px; border-radius: 50%; background: #3287f6; content: ""; }
    .nav-section { display: grid; gap: 3px; }
    .nav-link { display: flex; min-height: 34px; align-items: center; gap: 9px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #43494f; font-size: 12px; font-weight: 600; text-align: left; text-decoration: none; }
    .nav-link.active { background: #f1f2f3; color: #202429; font-weight: 750; }
    .nav-icon { display: inline-grid; width: 16px; flex: 0 0 16px; place-items: center; color: #8b9299; font-size: 14px; }
    .nav-label { margin: 16px 5px 4px; color: #a0a6ac; font-size: 10px; }
    .account-footer { margin-top: auto; padding: 12px 5px 0; border-top: 1px solid var(--line); color: #737a81; font-size: 10px; }
    .account-footer form { margin-top: 7px; }
    .account-footer button { padding: 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    main { min-width: 0; padding: 28px; }
    .page-header { display: flex; max-width: 760px; align-items: center; justify-content: space-between; gap: 12px; margin: 0 auto 18px; }
    h1 { margin: 0; font-size: 18px; }
    .back-link { color: #626a72; font-size: 12px; text-decoration: none; }
    .form-card { max-width: 760px; margin: 0 auto; padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { display: grid; align-content: start; gap: 6px; color: #4b5259; font-size: 12px; font-weight: 650; }
    .field.full { grid-column: 1 / -1; }
    input, select, textarea { width: 100%; min-width: 0; padding: 9px 10px; border: 1px solid #e3e6e9; border-radius: 8px; background: #fff; color: #292d32; font-size: 13px; }
    textarea { min-height: 92px; resize: vertical; line-height: 1.6; }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid #78b5ff; outline-offset: 2px; }
    .hint { color: #858c93; font-size: 11px; font-weight: 400; }
    .preview { min-height: 0; padding: 0 10px; color: #626a72; font-size: 12px; font-weight: 400; line-height: 1.7; white-space: pre-wrap; }
    .errors { margin: 0 0 18px; padding: 10px 14px 10px 30px; border-radius: 8px; background: #fff2f2; color: #b43c3c; font-size: 12px; line-height: 1.7; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .button { display: inline-flex; min-height: 36px; align-items: center; justify-content: center; padding: 0 14px; border: 1px solid #e3e6e9; border-radius: 9px; background: #fff; font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .button.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    @media (max-width: 760px) {
      .app { grid-template-columns: 54px minmax(0, 1fr); }
      .sidebar { align-items: center; padding-right: 4px; padding-left: 4px; }
      .brand { justify-content: center; width: 100%; font-size: 0; }
      .nav-link { width: 44px; justify-content: center; padding: 0; }
      .nav-label, .nav-label-text { display: none; }
      main { padding: 18px 12px; }
      .form-card { padding: 16px; }
    }
    @media (max-width: 520px) {
      .fields { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="주 메뉴">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>ProbOCR</div>
      <nav class="nav-section">
        <div class="nav-label">문제 관리</div>
        {% for item in nav_items %}
        <a class="nav-link{% if item.endpoint == 'new_question' %} active{% endif %}" href="{{ url_for(item.endpoint) }}"{% if item.endpoint == 'new_question' %} aria-current="page"{% endif %}>
          <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span><span class="nav-label-text">{{ item.label }}</span>
        </a>
        {% endfor %}
      </nav>
      <div class="account-footer">
        {{ current_user.display_name }} · {{ '관리자' if current_user.role == 'admin' else '사용자' }}
        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <button type="submit">로그아웃</button>
        </form>
      </div>
    </aside>
    <main>
      <header class="page-header">
        <h1>문제 등록</h1>
        <a class="back-link" href="{{ url_for('main') }}">문제 DB로 돌아가기</a>
      </header>
      <form class="form-card" method="post" action="{{ url_for('new_question') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        {% if errors %}
        <ul class="errors" role="alert">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
        {% endif %}
        <div class="fields">
          <label class="field">과목
            <select name="subject" required>
              <option value="">과목 선택</option>
              {% for subject in subjects %}
              <option value="{{ subject }}"{% if form_data.get('subject') == subject %} selected{% endif %}>{{ subject }}</option>
              {% endfor %}
            </select>
          </label>
          <label class="field">학년
            <input name="grade" maxlength="50" value="{{ form_data.get('grade', '') }}" required>
          </label>
          <label class="field full">단원
            <input name="unit" maxlength="200" value="{{ form_data.get('unit', '') }}" required>
          </label>
          <label class="field full">폴더 <span class="hint">선택 사항</span>
            <select name="folder_uuid">
              <option value="">폴더 미지정</option>
              {% for folder in folder_options %}
              <option value="{{ folder.uuid }}"{% if form_data.get('folder_uuid') == folder.uuid %} selected{% endif %}>{% for _ in range(folder.depth) %}　{% endfor %}{{ folder.name }}</option>
              {% endfor %}
            </select>
          </label>
          <label class="field full">지문 <span class="hint">선택 사항 · 수식은 $...$, \(...\), $$...$$ 또는 \[...\]로 입력</span>
            <textarea name="passage" maxlength="10000" data-math-input="passage-preview">{{ form_data.get('passage', '') }}</textarea>
            <output class="preview" id="passage-preview" aria-live="polite"></output>
          </label>
          <label class="field full">문제 내용
            <textarea name="prompt" maxlength="10000" data-math-input="prompt-preview" required>{{ form_data.get('prompt', '') }}</textarea>
            <output class="preview" id="prompt-preview" aria-live="polite"></output>
          </label>
          <label class="field full">보기 <span class="hint">선택 사항 · 수식은 $...$, \(...\), $$...$$ 또는 \[...\]로 입력</span>
            <textarea name="examples" maxlength="10000" data-math-input="examples-preview">{{ form_data.get('examples', '') }}</textarea>
            <output class="preview" id="examples-preview" aria-live="polite"></output>
          </label>
          <label class="field full">선택지 <span class="hint">선택 사항 · 한 줄에 하나씩 입력</span>
            <textarea name="choices" data-math-input="choices-preview">{{ form_data.get('choices', '') }}</textarea>
            <output class="preview" id="choices-preview" aria-live="polite"></output>
          </label>
          <label class="field full">답
            <textarea name="answer" maxlength="2000" data-math-input="answer-preview" required>{{ form_data.get('answer', '') }}</textarea>
            <output class="preview" id="answer-preview" aria-live="polite"></output>
          </label>
          <label class="field full">출처
            <input name="source" maxlength="300" value="{{ form_data.get('source', '') }}" required>
          </label>
          <label class="field">연도 <span class="hint">선택 사항</span>
            <input name="year" type="number" min="1" max="2200" value="{{ form_data.get('year', '') }}">
          </label>
          <label class="field">페이지 <span class="hint">선택 사항</span>
            <input name="page" type="number" min="1" max="10000" value="{{ form_data.get('page', '') }}">
          </label>
        </div>
        <div class="actions">
          <a class="button" href="{{ url_for('main') }}">취소</a>
          <button class="button primary" type="submit">문제 저장</button>
        </div>
      </form>
    </main>
  </div>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
  <script>
    const mathOptions = {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\[", right: "\\]", display: true },
        { left: "\\(", right: "\\)", display: false },
        { left: "$", right: "$", display: false }
      ],
      throwOnError: false
    };

    window.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("[data-math-input]").forEach((input) => {
        const preview = document.getElementById(input.dataset.mathInput);
        const updatePreview = () => {
          preview.textContent = input.value;
          renderMathInElement(preview, mathOptions);
        };
        input.addEventListener("input", updatePreview);
        updatePreview();
      });
    });
  </script>
</body>
</html>
